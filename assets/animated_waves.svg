<svg viewBox="0 130 800 140" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%">
  <defs>
    <style>
      /* Typography Styling */
      .name-text {
        font-family: 'Montserrat', 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 54px;
        letter-spacing: 4px;
        text-transform: uppercase;
        fill: #ffffff;
      }
      
      .wave-line {
        stroke: #ffffff;
      }

      /* Theming for GitHub Light/Dark Mode */
      @media (prefers-color-scheme: light) {
        .wave-line { stroke: #0f172a; }
        .name-text { fill: #0f172a; }
      }
      @media (prefers-color-scheme: dark) {
        .wave-line { stroke: #ffffff; }
        .name-text { fill: #ffffff; }
      }
    </style>

    <!-- Base Repeating Wave Pattern Tile -->
    <g id="wave-pattern" fill="none" stroke-linecap="round">
      <path d="M 0,200 Q 200,60 400,200 T 800,200" stroke-width="3.5" opacity="0.9" class="wave-line"></path>
      <path d="M 0,170 Q 200,30 400,170 T 800,170" stroke-width="2" opacity="0.5" class="wave-line"></path>
      <path d="M 0,230 Q 200,90 400,230 T 800,230" stroke-width="2.5" opacity="0.6" class="wave-line"></path>
      <path d="M 0,200 Q 200,110 400,200 T 800,200" stroke-width="1.2" opacity="0.4" class="wave-line"></path>
      <path d="M 0,185 Q 200,45 400,185 T 800,185" stroke-width="2.8" opacity="0.3" class="wave-line"></path>
    </g>
  </defs>

  <!-- Animated Layer: Two identical wave tiles side-by-side (using SMIL for perfect compatibility) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="8s" repeatCount="indefinite" />
    <use href="#wave-pattern" xlink:href="#wave-pattern" x="0" y="0"></use>
    <use href="#wave-pattern" xlink:href="#wave-pattern" x="800" y="0"></use>
  </g>

  <!-- Text Layer Positioned to the far left -->
  <text x="30" y="225" dominant-baseline="middle" text-anchor="start" class="name-text">Aman Karn</text>

  <!-- Floating Robot & Workstation at the far right, made larger -->
  <g>
    <!-- Robot floating animation -->
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="4s" repeatCount="indefinite" />
    
    <g transform="translate(630, 185) scale(1.4)">
      <!-- Desk/Laptop Base -->
      <path d="M 10,50 L 90,50 L 85,55 L 15,55 Z" fill="#4B5563"/>
      
      <!-- Laptop Screen Base -->
      <rect x="25" y="15" width="50" height="35" rx="3" fill="#1F2937" stroke="#9CA3AF" stroke-width="2"/>
      
      <!-- Screen Code Lines -->
      <line x1="32" y1="23" x2="68" y2="23" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
      <line x1="32" y1="29" x2="55" y2="29" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
      <line x1="32" y1="35" x2="62" y2="35" stroke="#F43F5E" stroke-width="2" stroke-linecap="round"/>
      <line x1="32" y1="41" x2="48" y2="41" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>

      <!-- Robot Head -->
      <rect x="30" y="-20" width="40" height="30" rx="6" fill="#374151" stroke="#D1D5DB" stroke-width="2"/>
      <!-- Robot Ear Left -->
      <rect x="25" y="-10" width="5" height="10" rx="2" fill="#D1D5DB"/>
      <!-- Robot Ear Right -->
      <rect x="70" y="-10" width="5" height="10" rx="2" fill="#D1D5DB"/>
      
      <!-- Eyes -->
      <circle cx="40" cy="-5" r="4" fill="#60A5FA">
        <animate attributeName="opacity" values="1;1;0.1;1" dur="4s" keyTimes="0;0.9;0.95;1" repeatCount="indefinite" />
      </circle>
      <circle cx="60" cy="-5" r="4" fill="#60A5FA">
        <animate attributeName="opacity" values="1;1;0.1;1" dur="4s" keyTimes="0;0.9;0.95;1" repeatCount="indefinite" />
      </circle>
      
      <!-- Antenna -->
      <line x1="50" y1="-20" x2="50" y2="-35" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="50" cy="-35" r="3" fill="#F43F5E">
        <animate attributeName="fill" values="#F43F5E;#10B981;#F43F5E" dur="2s" repeatCount="indefinite" />
      </circle>

      <!-- Typing Arms -->
      <!-- Left Arm -->
      <path d="M 28,10 Q 15,30 35,48" fill="none" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round">
         <animate attributeName="d" values="M 28,10 Q 15,30 35,48; M 28,10 Q 20,35 45,48; M 28,10 Q 15,30 35,48" dur="0.5s" repeatCount="indefinite" />
      </path>
      <!-- Right Arm -->
      <path d="M 72,10 Q 85,30 65,48" fill="none" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round">
         <animate attributeName="d" values="M 72,10 Q 85,30 65,48; M 72,10 Q 75,35 55,48; M 72,10 Q 85,30 65,48" dur="0.7s" repeatCount="indefinite" />
      </path>
    </g>
  </g>
</svg>
