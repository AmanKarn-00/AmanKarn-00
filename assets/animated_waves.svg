<svg viewBox="0 0 800 400" xmlns="http://w3.org" width="100%" height="100%">
  <defs>
    <!-- Combined CSS Animations for Stroke Drawing Intro and Seamless Infinite Scrolling -->
    <style>
      /* 1. Infinite Horizontal Scrolling */
      @keyframes scroll {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-800px, 0, 0); }
      }
      .animated-wave-group {
        animation: scroll 8s linear infinite;
      }
      
      /* 2. Typography Styling */
      .left-text {
        font-family: 'Montserrat', 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 54px;
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      /* 3. SVG Artista Draw-In Keyframe Animations */
      @keyframes animate-svg-stroke-1 {
        0% { stroke-dashoffset: 1726.43px; stroke-dasharray: 863.21px; }
        100% { stroke-dashoffset: 863.21px; stroke-dasharray: 863.21px; }
      }
      @keyframes animate-svg-stroke-2 {
        0% { stroke-dashoffset: 1726.43px; stroke-dasharray: 863.21px; }
        100% { stroke-dashoffset: 863.21px; stroke-dasharray: 863.21px; }
      }
      @keyframes animate-svg-stroke-3 {
        0% { stroke-dashoffset: 1726.43px; stroke-dasharray: 863.21px; }
        100% { stroke-dashoffset: 863.21px; stroke-dasharray: 863.21px; }
      }
      @keyframes animate-svg-stroke-4 {
        0% { stroke-dashoffset: 1656.47px; stroke-dasharray: 828.23px; }
        100% { stroke-dashoffset: 828.23px; stroke-dasharray: 828.23px; }
      }
      @keyframes animate-svg-stroke-5 {
        0% { stroke-dashoffset: 1726.43px; stroke-dasharray: 863.21px; }
        100% { stroke-dashoffset: 863.21px; stroke-dasharray: 863.21px; }
      }

      /* 4. Applying Intro Animations to Individual Paths */
      .svg-elem-1 { animation: animate-svg-stroke-1 2s cubic-bezier(0.47, 0, 0.745, 0.715) 0s both; }
      .svg-elem-2 { animation: animate-svg-stroke-2 2s cubic-bezier(0.47, 0, 0.745, 0.715) 0.15s both; }
      .svg-elem-3 { animation: animate-svg-stroke-3 2s cubic-bezier(0.47, 0, 0.745, 0.715) 0.3s both; }
      .svg-elem-4 { animation: animate-svg-stroke-4 2s cubic-bezier(0.47, 0, 0.745, 0.715) 0.45s both; }
      .svg-elem-5 { animation: animate-svg-stroke-5 2s cubic-bezier(0.47, 0, 0.745, 0.715) 0.6s both; }
    </style>

    <!-- Base Repeating Wave Pattern Tile (800px wide, perfect seamless start/end) -->
    <g id="wave-pattern" fill="none" stroke="#ffffff" stroke-linecap="round">
      <!-- Path 1: Main Flow -->
      <path d="M 0,200 Q 200,60 400,200 T 800,200" stroke-width="3.5" opacity="0.9" class="svg-elem-1"></path>
      
      <!-- Path 2: Upper Shifted Flow -->
      <path d="M 0,170 Q 200,30 400,170 T 800,170" stroke-width="2" opacity="0.5" class="svg-elem-2"></path>
      
      <!-- Path 3: Lower Shifted Flow -->
      <path d="M 0,230 Q 200,90 400,230 T 800,230" stroke-width="2.5" opacity="0.6" class="svg-elem-3"></path>
      
      <!-- Path 4: Compressed Wave -->
      <path d="M 0,200 Q 200,110 400,200 T 800,200" stroke-width="1.2" opacity="0.4" class="svg-elem-4"></path>
      
      <!-- Path 5: Counter-balanced Flow -->
      <path d="M 0,185 Q 200,45 400,185 T 800,185" stroke-width="2.8" opacity="0.3" class="svg-elem-5"></path>
    </g>
  </defs>

  <!-- Animated Layer: Two identical wave tiles side-by-side to allow infinite scrolling loop -->
  <g class="animated-wave-group">
    <use href="#wave-pattern" x="0" y="0"></use>
    <use href="#wave-pattern" x="800" y="0"></use>
  </g>

  <!-- Text Layer Positioned to the Left (X: 60px) and Vertically Centered -->
  <text x="60" y="50%" dominant-baseline="middle" text-anchor="start" fill="#ffffff" class="left-text">Aman Karn</text>
</svg>
